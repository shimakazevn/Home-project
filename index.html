<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>HOME - Visual Novel [Tiếng Việt]</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=./web/" />
  <script type="text/javascript">
    window.location.replace("./web/");
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .loader-box {
      padding: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #4fc3f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { margin: 0 0 10px 0; font-size: 1.4rem; }
    p { margin: 0; opacity: 0.8; font-size: 0.95rem; }
    a { color: #4fc3f7; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="loader-box">
    <div class="spinner"></div>
    <h2>Đang khởi động HOME Visual Novel...</h2>
    <p>Nếu không tự chuyển, vui lòng <a href="./web/">bấm vào đây để vào Game</a>.</p>
  </div>
</body>
</html>
